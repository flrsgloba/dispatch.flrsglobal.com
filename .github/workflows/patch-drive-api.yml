name: One-time Drive API URL patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Drive API endpoint
        env:
          OLD_URL: https://script.google.com/macros/s/AKfycbyTLvYbe1O_BbzsH09UMSZdbY9_XZXga-TbSPkR3UclT3Qhlaj7gy5yhXPA_UpE6Fu7tw/exec
          NEW_URL: https://script.google.com/macros/s/AKfycbzavxknADmXnvAhRqcf9areGCRpfAJIZ62v84kqb_hpfgfAWIUbngcCH4B8M9TpkuA-uw/exec
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('src/taskpane.js')
          text = path.read_text(encoding='utf-8')
          old = os.environ['OLD_URL']
          new = os.environ['NEW_URL']

          if old not in text:
              raise SystemExit('Expected old Drive API URL was not found; refusing to modify taskpane.js.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Drive API URL updated.')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/taskpane.js
          git rm .github/workflows/patch-drive-api.yml
          git commit -m "Wire taskpane to production Drive publishing bridge"
          git push