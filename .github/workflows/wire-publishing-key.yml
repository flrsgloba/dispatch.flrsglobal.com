name: Wire Pleasure Dispatch publishing key

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire publishing key into taskpane
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/taskpane.js')
          text = path.read_text(encoding='utf-8')

          key = '0209_04290528_LEAPyear'
          marker = 'const PUBLISH_KEY = "' + key + '";'

          if marker not in text:
              needle = 'const LIGHTBOX_BASE_URL ='
              if needle not in text:
                  raise SystemExit('Could not find taskpane insertion point.')
              text = text.replace(
                  needle,
                  '// Publishing authorization key. Sent automatically; never prompted for.\n' +
                  marker + '\n\n' +
                  needle,
                  1
              )

          old = 'action: "upload",\n    fileName:'
          new = 'action: "upload",\n    publishKey: PUBLISH_KEY,\n    fileName:'

          if 'publishKey: PUBLISH_KEY' not in text:
              if old not in text:
                  raise SystemExit('Could not find upload payload insertion point.')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Publishing key wired into taskpane.js.')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/taskpane.js
          git rm .github/workflows/wire-publishing-key.yml
          git commit -m "Wire publishing key into Dispatch taskpane"
          git push