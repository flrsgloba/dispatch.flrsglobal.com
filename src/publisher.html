<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    The Pleasure Dispatch Publisher
  </title>

  <!-- REQUIRED FOR OFFICE DIALOG API -->
  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
  ></script>

  <style>

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;

      background: #303030;

      color: #F2EEE5;

      font-family:
        Arial,
        sans-serif;

    }


    body {

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #status {

      width: 100%;

      max-width: 360px;

      padding: 32px;

      box-sizing: border-box;

      text-align: center;

      font-size: 14px;

      line-height: 1.6;

    }

  </style>

</head>

<body>

  <div id="status">
    Preparing publisher…
  </div>


  <script>

    (function () {

      "use strict";


      const statusElement =
        document.getElementById(
          "status"
        );


      let hasReceivedPayload =
        false;


      function setStatus(
        message
      ) {

        if (
          statusElement
        ) {

          statusElement.textContent =
            message;

        }


        console.log(
          "[Pleasure Dispatch Publisher]",
          message
        );

      }


      function sendToParent(
        message
      ) {

        if (
          !window.Office ||
          !Office.context ||
          !Office.context.ui ||
          typeof Office.context.ui.messageParent !==
            "function"
        ) {

          console.error(
            "[Pleasure Dispatch Publisher] messageParent unavailable."
          );

          return false;

        }


        try {

          Office.context.ui.messageParent(
            JSON.stringify(
              message
            )
          );


          return true;

        } catch (
          error
        ) {

          console.error(
            "[Pleasure Dispatch Publisher] Failed to send message:",
            error
          );


          return false;

        }

      }


      async function publish(
        payload
      ) {

        try {

          setStatus(
            "Publishing Dispatch…"
          );


          console.log(
            "[Pleasure Dispatch Publisher] Sending payload."
          );


          const response =
            await fetch(
              "https://script.google.com/macros/s/AKfycbzavxknADmXnvAhRqcf9areGCRpfAJIZ62v84kqb_hpfgfAWIUbngcCH4B8M9TpkuA-uw/exec",
              {

                method:
                  "POST",

                headers: {

                  "Content-Type":
                    "text/plain;charset=utf-8"

                },

                body:
                  JSON.stringify(
                    payload
                  ),

                redirect:
                  "follow"

              }
            );


          const text =
            await response.text();


          console.log(
            "[Pleasure Dispatch Publisher] Response:",
            text
          );


          let data;


          try {

            data =
              JSON.parse(
                text
              );

          } catch (
            parseError
          ) {

            throw new Error(
              "Publisher returned an invalid response."
            );

          }


          if (
            data &&
            data.status ===
              "published"
          ) {

            setStatus(
              "Dispatch published."
            );


            sendToParent({

              type:
                "publishResult",

              success:
                true,

              data:
                data

            });


            return;

          }


          throw new Error(
            (
              data &&
              data.message
            ) ||
            "Publishing failed."
          );


        } catch (
          error
        ) {

          console.error(
            "[Pleasure Dispatch Publisher] Publish error:",
            error
          );


          setStatus(
            "Publishing failed."
          );


          sendToParent({

            type:
              "publishResult",

            success:
              false,

            error:
              error &&
              error.message
                ? error.message
                : String(
                    error
                  )

          });

        }

      }


      function receiveFromParent(
        event
      ) {

        console.log(
          "[Pleasure Dispatch Publisher] Parent message received:",
          event
        );


        let message;


        try {

          message =
            JSON.parse(
              event.message
            );

        } catch (
          error
        ) {

          console.error(
            "[Pleasure Dispatch Publisher] Invalid parent message."
          );


          return;

        }


        if (
          !message
        ) {

          return;

        }


        if (
          message.type !==
          "publishPayload"
        ) {

          return;

        }


        if (
          hasReceivedPayload
        ) {

          console.log(
            "[Pleasure Dispatch Publisher] Duplicate payload ignored."
          );


          return;

        }


        hasReceivedPayload =
          true;


        if (
          !message.payload
        ) {

          sendToParent({

            type:
              "publishResult",

            success:
              false,

            error:
              "No publishing payload received."

          });


          return;

        }


        publish(
          message.payload
        );

      }


      function initializePublisher() {

        setStatus(
          "Connecting to publisher…"
        );


        if (
          !window.Office ||
          !Office.context ||
          !Office.context.ui
        ) {

          console.error(
            "[Pleasure Dispatch Publisher] Office context unavailable."
          );


          setStatus(
            "Office connection unavailable."
          );


          return;

        }


        Office.context.ui.addHandlerAsync(
          Office.EventType.DialogParentMessageReceived,

          receiveFromParent,

          function (
            result
          ) {

            if (
              result.status !==
              Office.AsyncResultStatus.Succeeded
            ) {

              console.error(
                "[Pleasure Dispatch Publisher] Failed to register parent message handler:",
                result.error
              );


              sendToParent({

                type:
                  "publishResult",

                success:
                  false,

                error:
                  "Publisher could not receive the Dispatch."

              });


              return;

            }


            setStatus(
              "Publisher ready…"
            );


            console.log(
              "[Pleasure Dispatch Publisher] Sending publisherReady."
            );


            sendToParent({

              type:
                "publisherReady"

            });

          }

        );

      }


      if (
        window.Office &&
        typeof Office.onReady ===
          "function"
      ) {

        Office.onReady(
          function () {

            initializePublisher();

          }
        );

      } else {

        window.addEventListener(
          "load",

          function () {

            setTimeout(
              initializePublisher,
              250
            );

          }
        );

      }

    })();

  </script>

</body>

</html>
