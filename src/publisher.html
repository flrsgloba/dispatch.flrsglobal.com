<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Pleasure Dispatch Publisher</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    html,body{margin:0;padding:0;width:100%;min-height:100%;background:#303030;color:#F2EEE5;font-family:Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center}
    #status{text-align:center;padding:28px;font-size:14px;line-height:1.5}
  </style>
</head>
<body>
  <div id="status">Preparing publisher…</div>

  <script>
  (function(){
    "use strict";

    var statusElement=document.getElementById("status");
    var payloadReceived=false;
    var officeReady=false;

    function setStatus(message){
      if(statusElement) statusElement.textContent=message;
      console.log("[Pleasure Dispatch Publisher]",message);
    }

    function send(message){
      if(!officeReady || !window.Office || !Office.context || !Office.context.ui || typeof Office.context.ui.messageParent!=="function"){
        console.warn("[Pleasure Dispatch Publisher] messageParent unavailable.");
        return false;
      }
      try{
        Office.context.ui.messageParent(JSON.stringify(message));
        return true;
      }catch(error){
        console.error("[Pleasure Dispatch Publisher] messageParent failed:",error);
        return false;
      }
    }

    function publish(payload){
      if(payloadReceived) return;
      payloadReceived=true;
      setStatus("Publishing Dispatch…");

      fetch("https://script.google.com/macros/s/AKfycbzavxknADmXnvAhRqcf9areGCRpfAJIZ62v84kqb_hpfgfAWIUbngcCH4B8M9TpkuA-uw/exec",{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload),
        redirect:"follow"
      })
      .then(function(response){
        return response.text().then(function(text){
          return {ok:response.ok,status:response.status,text:text};
        });
      })
      .then(function(result){
        console.log("[Pleasure Dispatch Publisher] HTTP response:",result.status,result.text);
        var data;
        try{ data=JSON.parse(result.text); }
        catch(error){ throw new Error("Publisher returned an invalid response (HTTP "+result.status+")."); }

        if(data && data.status==="published"){
          setStatus("Dispatch published.");
          send({type:"publishResult",success:true,data:data});
          return;
        }

        throw new Error((data && data.message)||"Publishing failed.");
      })
      .catch(function(error){
        console.error("[Pleasure Dispatch Publisher] Publish error:",error);
        setStatus("Publishing failed.");
        send({type:"publishResult",success:false,error:error&&error.message?error.message:String(error)});
      });
    }

    function receive(event){
      var raw=event&&event.message;
      if(!raw) return;

      var message;
      try{ message=JSON.parse(raw); }
      catch(error){ return; }

      console.log("[Pleasure Dispatch Publisher] Parent message:",message);

      if(message.type==="publisherPing"){
        setStatus("Publisher ready…");
        send({type:"publisherReady"});
        return;
      }

      if(message.type==="publishPayload" && message.payload){
        publish(message.payload);
      }
    }

    function initialize(){
      if(!window.Office || !Office.context || !Office.context.ui){
        setStatus("Office connection unavailable.");
        return;
      }

      Office.context.ui.addHandlerAsync(
        Office.EventType.DialogParentMessageReceived,
        receive,
        function(result){
          if(result.status!==Office.AsyncResultStatus.Succeeded){
            console.error("[Pleasure Dispatch Publisher] Handler registration failed:",result.error);
            setStatus("Publisher could not connect.");
            return;
          }

          officeReady=true;
          setStatus("Waiting for Dispatch…");
          console.log("[Pleasure Dispatch Publisher] Ready for parent handshake.");
        }
      );
    }

    if(window.Office && typeof Office.onReady==="function"){
      Office.onReady(function(){ initialize(); });
    }else{
      window.addEventListener("load",initialize);
    }
  })();
  </script>
</body>
</html>
