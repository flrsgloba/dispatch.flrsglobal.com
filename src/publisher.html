<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Publisher</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #303030;
      color: #F2EEE5;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      font-size: 12px;
      opacity: .75;
    }
  </style>
</head>

<body>

  <div id="status">
    Connecting…
  </div>

  <script>
    (function () {

      "use strict";

      const PUBLISHER_URL =
        "https://script.google.com/macros/s/AKfycbzavxknADmXnvAhRqcf9areGCRpfAJIZ62v84kqb_hpfgfAWIUbngcCH4B8M9TpkuA-uw/exec";

      const target =
        PUBLISHER_URL +
        "?action=publisherDialog";

      document.getElementById(
        "status"
      ).textContent =
        "Connecting…";

      window.location.replace(
        target
      );

    })();
  </script>

</body>
</html>
