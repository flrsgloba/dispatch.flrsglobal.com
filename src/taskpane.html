<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Pleasure Dispatch</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <main class="composer">
    <header class="masthead">
      <div class="brand">
        <div class="brand-name">FLRS GLOBAL</div>
        <div class="brand-sub">From the Studio of Freddie L. Rankin II</div>
      </div>
      <div class="masthead-mark" aria-hidden="true">
        <span class="motif motif-small"></span>
      </div>
    </header>

    <section class="title-block">
      <div class="dispatch-label">THE PLEASURE DISPATCH</div>
      <div class="meta-row">
        <input id="edition" aria-label="Edition" value="No. 001">
        <input id="date" aria-label="Date" placeholder="February 2026">
      </div>
      <input id="title" class="title-input" aria-label="Dispatch title" placeholder="A Reflection">
      <input id="subtitle" class="subtitle-input" aria-label="Dispatch subtitle" placeholder="An artistic update">
    </section>

    <div class="motif-rule"><span class="motif"></span></div>

    <section class="editor-section">
      <div class="section-label">01 — A REFLECTION</div>
      <textarea id="reflection" placeholder="Write the opening reflection..."></textarea>
    </section>

    <section class="editor-section">
      <div class="section-label">02 — THE WORK</div>
      <input id="workTitle" placeholder="Work / series title">
      <input id="workMeta" placeholder="2026 · Photography / Painting / Ceramics">
      <input id="workImage" placeholder="Image URL">
      <textarea id="workText" placeholder="A short text about the work..." class="short"></textarea>
    </section>

    <section class="editor-section">
      <div class="section-label">03 — STUDIO NOTES</div>
      <input id="studioImage" placeholder="Optional image URL">
      <input id="studioTitle" placeholder="Studio note title">
      <textarea id="studioText" placeholder="What has been holding your attention..."></textarea>
    </section>

    <section class="editor-section">
      <div class="section-label">04 — PLEASURE NOTES</div>
      <div class="hint">An offering of what has held my attention.</div>
      <div class="pleasure-grid">
        <input id="pleasure1Label" placeholder="COFFEE">
        <input id="pleasure1" placeholder="Name / note / ritual">
        <input id="pleasure2Label" placeholder="ART">
        <input id="pleasure2" placeholder="Artist / work / exhibition">
        <input id="pleasure3Label" placeholder="OBJECT">
        <input id="pleasure3" placeholder="Object / fragrance / clothing">
        <input id="pleasure4Label" placeholder="PLACE">
        <input id="pleasure4" placeholder="Place / meal / encounter">
        <input id="pleasure5Label" placeholder="RITUAL">
        <input id="pleasure5" placeholder="A repeated act of attention">
      </div>
    </section>

    <section class="editor-section">
      <div class="section-label">05 — AN INVITATION</div>
      <input id="inviteTitle" placeholder="Sittings This Spring / The Pleasure Table / Available Work">
      <textarea id="inviteText" class="short" placeholder="Invitation text..."></textarea>
      <div class="two-col">
        <input id="ctaLabel" value="INQUIRE">
        <input id="ctaUrl" placeholder="https://...">
      </div>
    </section>

    <section class="editor-section closing-section">
      <div class="section-label">06 — CLOSING</div>
      <textarea id="closing" placeholder="A short closing note..." class="short"></textarea>
      <input id="question" value="What has held your attention lately?" aria-label="Closing question">
    </section>

    <footer class="actions">
      <button id="previewBtn" class="secondary">Preview</button>
      <button id="insertBtn" class="primary">Build in Outlook</button>
    </footer>
    <div id="status" class="status" role="status"></div>
  </main>
  <script src="taskpane.js"></script>
</body>
</html>
