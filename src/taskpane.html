<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Pleasure Dispatch</title><link rel="stylesheet" href="taskpane.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head>
<body>
<main class="shell">
<header class="masthead"><div><div class="eyebrow">FLRSGLOBAL</div><h1>The Pleasure Dispatch</h1><div class="edition">PERSONAL PUBLISHING STUDIO</div></div><div class="mark">FLR</div></header>
<section class="intro"><label>Edition</label><input id="edition" value="No. 001"><label>Title</label><input id="title" placeholder="On Pleasure & Distance"></section>
<section class="section"><div class="section-head"><span>01</span><strong>A Note on Pleasure</strong></div><textarea id="note" placeholder="Write the opening note..."></textarea></section>
<section class="section"><div class="section-head"><span>02</span><strong>The Image</strong></div><input id="imageUrl" placeholder="Hero image URL (optional)"><input id="imageAlt" placeholder="Image description"><textarea id="imageCaption" placeholder="Title / year / medium / short caption"></textarea></section>
<section class="section"><div class="section-head"><span>03</span><strong>The Encounter</strong></div><textarea id="encounter" placeholder="Artist, book, object, place, meal, idea..."></textarea></section>
<section class="section"><div class="section-head"><span>04</span><strong>Pleasure, Currently</strong></div><div class="grid"><input id="coffee" placeholder="Coffee"><input id="music" placeholder="Music"><input id="place" placeholder="Place"><input id="object" placeholder="Object"><input id="ritual" placeholder="Ritual"></div></section>
<section class="section"><div class="section-head"><span>05</span><strong>From FLRSGLOBAL</strong></div><textarea id="studio" placeholder="Studio news, exhibitions, dinners, residencies, works..."></textarea></section>
<section class="section"><div class="section-head"><span>06</span><strong>A Question</strong></div><input id="question" value="What has given you pleasure lately?"></section>
<section class="actions"><button id="previewBtn" class="secondary">Preview</button><button id="insertBtn" class="primary">Build in Outlook</button></section><div id="status" class="status"></div>
</main><script src="taskpane.js"></script></body></html>
