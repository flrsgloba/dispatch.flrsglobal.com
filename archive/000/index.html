<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="The Pleasure Dispatch — No. 000"
  >

  <link
    rel="canonical"
    href="https://dispatch.flrsglobal.com/000/"
  >

  <link
    rel="stylesheet"
    href="/styles.css"
  >

  <title>
    The Pleasure Dispatch — No. 000
  </title>

</head>

<body>

<header class="site-header shell">

  <div class="header-brand">

    <a
      class="wordmark"
      href="/"
      aria-label="The Pleasure Dispatch home"
    >
      FLRSGLOBAL
    </a>

  </div>

  <nav aria-label="Primary navigation">

    <a href="/archive/">
      Archive
    </a>

    <a href="/#about">
      About
    </a>

  </nav>

</header>


<main>

  <div
    id="dispatch"
    aria-live="polite"
  >
    <section class="hero shell">

      <div class="eyebrow">
        THE PLEASURE DISPATCH
      </div>

      <h1>
        Loading…
      </h1>

    </section>
  </div>

</main>


<footer class="site-footer shell">

  <span>
    THE PLEASURE DISPATCH
  </span>

  <span>
    BY FLRSGLOBAL · NEW YORK
  </span>

</footer>


<script>

(function () {

  const container =
    document.getElementById('dispatch');


  fetch(
    '/data/dispatches.json?v=' +
    Date.now(),
    {
      cache: 'no-store'
    }
  )

  .then(function (response) {

    if (!response.ok) {

      throw new Error(
        'Could not load dispatch.'
      );

    }

    return response.json();

  })

  .then(function (data) {

    const dispatches =
      Array.isArray(data.dispatches)
        ? data.dispatches
        : [];


    const dispatch =
      dispatches.find(
        function (item) {

          return String(
            item.edition
          ) === '000';

        }
      );


    if (!dispatch) {

      throw new Error(
        'Dispatch No. 000 was not found.'
      );

    }


    container.innerHTML =
      dispatch.html;


    document.title =
      'The Pleasure Dispatch — No. ' +
      dispatch.edition;

  })

  .catch(function (error) {

    console.error(error);

    container.innerHTML =

      '<section class="hero shell">' +

        '<div class="eyebrow">' +
          'THE PLEASURE DISPATCH' +
        '</div>' +

        '<h1>Dispatch unavailable.</h1>' +

        '<p>' +
          'The dispatch could not be loaded.' +
        '</p>' +

        '<a class="text-link" href="/archive/">' +
          'Return to archive <span>↗</span>' +
        '</a>' +

      '</section>';

  });

}());

</script>

</body>
</html>
