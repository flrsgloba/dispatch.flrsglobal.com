<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="The Pleasure Dispatch archive by FLRSGLOBAL."
  >

  <link
    rel="canonical"
    href="https://dispatch.flrsglobal.com/archive/"
  >

  <link rel="stylesheet" href="/styles.css">

  <title>Archive — The Pleasure Dispatch</title>
</head>

<body>

<header class="site-header shell">

  <div class="header-brand">
    <a
      class="wordmark"
      href="/"
      aria-label="The Pleasure Dispatch home"
    >
      FLRSGLOBAL
    </a>
  </div>

  <div class="header-nav-wrap">

    <nav aria-label="Primary navigation">
      <a href="/archive/">Archive</a>
      <a href="/#about">About</a>
    </nav>

    <form
      class="site-search"
      role="search"
      action="/archive/"
      method="get"
    >

      <label
        class="sr-only"
        for="dispatch-search"
      >
        Search Dispatches
      </label>

      <input
        id="dispatch-search"
        name="q"
        type="search"
        placeholder="Search Dispatches"
        autocomplete="off"
      >

      <button
        type="submit"
        aria-label="Search"
      >
        ↗
      </button>

    </form>

  </div>

</header>


<main class="shell">

<section class="hero archive-hero">

  <div class="eyebrow">
    THE PLEASURE DISPATCH
  </div>

  <h1>Archive</h1>

  <p class="archive-intro">
    A growing record of dispatches from the studio and the life around it.
  </p>

</section>


<section
  class="archive-list"
  aria-labelledby="archive-heading"
>

  <div class="section-label">
    <span>THE EDITIONS</span>
    <span id="archive-count">Loading</span>
  </div>


  <div
    id="archive-results"
    class="dispatch-list"
  ></div>


  <p
    id="archive-loading"
    class="no-results"
  >
    Loading Dispatches…
  </p>


  <p
    id="no-results"
    class="no-results"
    hidden
  >
    No Dispatches found.
  </p>

</section>

</main>


<footer class="site-footer shell">

  <span>
    THE PLEASURE DISPATCH
  </span>

  <span>
    BY FLRSGLOBAL · NEW YORK
  </span>

</footer>


<script>

(function () {

  const feedUrl =
    '/data/dispatches.json';

  const form =
    document.querySelector('.site-search');

  const input =
    document.getElementById('dispatch-search');

  const results =
    document.getElementById('archive-results');

  const count =
    document.getElementById('archive-count');

  const loading =
    document.getElementById('archive-loading');

  const empty =
    document.getElementById('no-results');


  let entries = [];


  function editionUrl(edition) {

    return '/' +
      encodeURIComponent(String(edition)) +
      '/';

  }


  function formatDate(dateString) {

    if (!dateString) {
      return '';
    }

    const date =
      new Date(dateString + 'T12:00:00');

    if (isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString(
      'en-US',
      {
        month: 'long',
        year: 'numeric'
      }
    ).toUpperCase();

  }


  function createEntry(dispatch) {

    const link =
      document.createElement('a');

    link.className =
      'dispatch-entry';

    link.href =
      editionUrl(dispatch.edition);


    const number =
      document.createElement('div');

    number.className =
      'dispatch-number';

    number.textContent =
      dispatch.editionLabel ||
      dispatch.edition;


    const info =
      document.createElement('div');

    info.className =
      'dispatch-info';


    const date =
      document.createElement('div');

    date.className =
      'dispatch-date';

    date.textContent =
      formatDate(dispatch.date);


    const title =
      document.createElement('h2');

    title.textContent =
      dispatch.title ||
      'The Pleasure Dispatch';


    const arrow =
      document.createElement('span');

    arrow.className =
      'dispatch-arrow';

    arrow.textContent =
      '↗';


    info.appendChild(date);
    info.appendChild(title);

    link.appendChild(number);
    link.appendChild(info);
    link.appendChild(arrow);

    link.dataset.search =
      [
        dispatch.edition,
        dispatch.editionLabel,
        dispatch.date,
        dispatch.title,
        dispatch.subtitle,
        dispatch.subject,
        dispatch.searchText
      ]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();


    return link;

  }


  function render(query) {

    const q =
      String(query || '')
        .trim()
        .toLowerCase();


    results.innerHTML = '';

    let visible = 0;


    entries.forEach(function (entry) {

      const match =
        !q ||
        entry.dataset.search.includes(q);


      if (match) {

        entry.hidden = false;

        results.appendChild(entry);

        visible++;

      } else {

        entry.hidden = true;

      }

    });


    count.textContent =
      visible +
      (
        visible === 1
          ? ' Dispatch'
          : ' Dispatches'
      );


    empty.hidden =
      visible !== 0;

  }


  function loadArchive() {

    fetch(
      feedUrl +
      '?v=' +
      Date.now(),
      {
        cache: 'no-store'
      }
    )

    .then(function (response) {

      if (!response.ok) {

        throw new Error(
          'Could not load dispatch archive.'
        );

      }

      return response.json();

    })

    .then(function (data) {

      const dispatches =
        Array.isArray(data.dispatches)
          ? data.dispatches
          : [];


      entries =
        dispatches
          .map(createEntry);


      loading.hidden =
        true;


      render(
        new URLSearchParams(
          window.location.search
        ).get('q') || ''
      );

    })

    .catch(function (error) {

      console.error(error);

      loading.textContent =
        'The archive could not be loaded.';

      count.textContent =
        'Unavailable';

    });

  }


  form.addEventListener(
    'submit',
    function (event) {

      event.preventDefault();

      const query =
        input.value.trim();


      const url =
        new URL(
          window.location.href
        );


      if (query) {

        url.searchParams.set(
          'q',
          query
        );

      } else {

        url.searchParams.delete('q');

      }


      window.history.replaceState(
        {},
        '',
        url
      );


      render(query);

    }
  );


  input.addEventListener(
    'input',
    function () {

      render(
        input.value
      );

    }
  );


  const initialQuery =
    new URLSearchParams(
      window.location.search
    ).get('q') || '';


  input.value =
    initialQuery;


  loadArchive();

}());

</script>

</body>
</html>
