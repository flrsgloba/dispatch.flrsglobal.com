<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Pleasure Dispatch by FLRSGLOBAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1ea;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 12vh 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 9vw, 100px);
      line-height: 0.92;
      font-weight: 400;
      margin: 30px 0;
    }

    .description {
      max-width: 650px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 120px;
      padding-top: 20px;
      border-top: 1px solid #111;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main>

    <div>
      <div class="eyebrow">
        FLRSGLOBAL
      </div>

      <h1>
        The Pleasure<br>
        Dispatch
      </h1>

      <p class="description">
        A periodic dispatch on pleasure, art, objects, people,
        places, rituals, and the pursuit of contentment.
      </p>
    </div>

    <div class="footer">
      <span>By FLRSGLOBAL</span>
      <span>New York</span>
    </div>

  </main>

</body>
</html>
